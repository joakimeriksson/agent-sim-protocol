[project]
name = "agentsim-protocol"
version = "0.3.0"
description = "Agent Simulation Protocol: schemas, conformance checker and a batch client"
requires-python = ">=3.9"
dependencies = ["jsonschema>=4.18", "referencing>=0.30", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["conformance", "clients"]

[tool.uv]
package = false
